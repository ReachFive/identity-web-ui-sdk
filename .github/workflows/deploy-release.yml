name: Deploy Release

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    name: Deploy Release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install
      
      - name: Build
        run: npm run build

      - name: Publish to NPM
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      # The published tarball is large (~6 MB packed, ~30 MB unpacked), so npm
      # processes it asynchronously: `npm publish` returns before the version is
      # queryable, and any dist-tag write against it fails with a 403 until the
      # registry catches up (observed: ~5 minutes for v2.1.0). Retry until the
      # version lands rather than failing the release on that race.
      - name: Point next tag at the release
        run: |
          version=$(node -p "require('./package.json').version")
          for attempt in $(seq 1 60); do
            if npm dist-tag add "@reachfive/identity-ui@$version" next; then
              echo "next now points at $version"
              exit 0
            fi
            echo "Attempt $attempt failed; the registry may still be processing the publish. Retrying in 10s..."
            sleep 10
          done
          echo "::error::Timed out after 10 minutes pointing the next dist-tag at $version."
          exit 1
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}
