name: Continuous Integration

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  issue_comment:
    types: [created]
  # Publishes a release candidate like `/rc`, started from the Actions tab.
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the release pull request to publish a release candidate from
        required: true
        type: number

env:
  # A prerelease is built on `/rc` or on a manual run, from the head of that release pull request.
  PRERELEASE: ${{ github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch' }}
  PR_NUMBER: ${{ github.event.issue.number || inputs.pr }}

jobs:
  test:
    name: Build & Test
    # On issue_comment, only run for an `/rc` command posted by a maintainer on a
    # release-labelled PR — every other comment in the repo is ignored.
    if: >
      github.event_name != 'issue_comment' ||
      (github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/rc') &&
      contains(github.event.issue.labels.*.name, 'release') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # Reacting to a comment on a pull request returns a 403 with `issues: write` alone.
      pull-requests: write
    steps:
      - name: Acknowledge the /rc command
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: gh api --method POST "repos/$REPO/issues/comments/$COMMENT_ID/reactions" -f content=rocket

      - name: Check the pull request is a release
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh pr view "$PR_NUMBER" --repo "$REPO" --json labels --jq '.labels[].name' | grep -qx release; then
            echo "::error::Pull request #$PR_NUMBER does not carry the release label."
            exit 1
          fi

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 #v7.0.0
        with:
          # issue_comment and workflow_dispatch carry no PR ref: check out the head of the release PR.
          ref: ${{ env.PRERELEASE == 'true' && format('refs/pull/{0}/head', env.PR_NUMBER) || '' }}

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Run script unit tests
        run: npm run test:scripts

      - name: Install JUnit coverage reporter
        run: npm install --save-dev jest-junit

      - name: Run tests
        run: npm test -- --ci --reporters=default --reporters=jest-junit

      - name: Compute and set prerelease version
        if: env.PRERELEASE == 'true'
        run: |
          BASE=$(node -p "require('./package.json').version")
          VERSIONS=$(npm view @reachfive/identity-ui versions --json 2>/dev/null || echo '')
          RC=$(printf '%s' "$VERSIONS" | node scripts/prerelease-version.mjs "$BASE")
          echo "Prerelease version: $RC"
          npm pkg set version="$RC"

      - name: Build
        run: npm run build

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: jest-junit.xml
        env:
          JEST_JUNIT_OUTPUT_NAME: jest-junit.xml

      - name: Upload npm package artifact
        if: env.PRERELEASE == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a #v7.0.1
        with:
          name: npm-package
          retention-days: 1
          path: |
            package.json
            README.md
            LICENSE
            cjs
            es
            umd
            types

  # The only job with the `id-token: write` permission, which npm trusted
  # publishing (OIDC) needs to publish.
  publish-prerelease:
    name: Publish Prerelease
    needs: test
    if: github.event_name == 'issue_comment' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    concurrency:
      group: prerelease-${{ github.event.issue.number || inputs.pr }}
      cancel-in-progress: false
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e #v6.4.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c #v8.0.1
        with:
          name: npm-package
          path: .

      # npm matches these claims against the package's trusted publishers. Only the
      # payload is printed: without its signature, the token cannot be used.
      - name: Show the OIDC claims sent to npm
        run: |
          ID_TOKEN=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          echo "::add-mask::$ID_TOKEN"
          node -e '
            const claims = JSON.parse(Buffer.from(process.argv[1].split(".")[1], "base64url"));
            const keys = ["sub", "repository", "repository_owner", "workflow_ref", "job_workflow_ref", "event_name", "ref", "environment"];
            console.log(JSON.stringify(Object.fromEntries(keys.map((key) => [key, claims[key] ?? null])), null, 2));
          ' "$ID_TOKEN"

      - name: Publish prerelease to NPM (next tag)
        # `verbose` prints the registry's reason when the OIDC token exchange fails.
        run: npm publish --tag next --provenance --access public --loglevel verbose

      - name: Comment prerelease version on PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          MARKER="<!-- prerelease-publish -->"
          BODY="$MARKER
          📦 Published prerelease \`$VERSION\` to npm on dist-tag \`next\`.

          Install it with:
          \`\`\`sh
          npm install @reachfive/identity-ui@$VERSION
          \`\`\`
          This prerelease is **not** tagged \`latest\` and will not affect production consumers."
          COMMENT_ID=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.body | startswith(\"$MARKER\")) | .id" | head -n1)
          if [ -n "$COMMENT_ID" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$COMMENT_ID" -f body="$BODY"
          else
            gh api --method POST "repos/$REPO/issues/$PR_NUMBER/comments" -f body="$BODY"
          fi
